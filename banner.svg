<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="0.5" stop-color="#111827"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="accent" x1="250" y1="100" x2="950" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>

  <!-- Decorative grid -->
  <g opacity="0.12" stroke="#94A3B8">
    <path d="M0 60H1200"/>
    <path d="M0 120H1200"/>
    <path d="M0 180H1200"/>
    <path d="M0 240H1200"/>
    <path d="M100 0V300"/>
    <path d="M200 0V300"/>
    <path d="M300 0V300"/>
    <path d="M400 0V300"/>
    <path d="M500 0V300"/>
    <path d="M600 0V300"/>
    <path d="M700 0V300"/>
    <path d="M800 0V300"/>
    <path d="M900 0V300"/>
    <path d="M1000 0V300"/>
    <path d="M1100 0V300"/>
  </g>

  <!-- Cloud -->
  <g transform="translate(850 65)" filter="url(#glow)">
    <path
      d="M35 105H170C193 105 212 87 212 64C212 42 194 24 172 24C166 24 160 25 154 27C143 8 122 -4 98 -4C68 -4 42 16 35 44C31 43 27 42 22 42C2 42 -14 58 -14 78C-14 93 0 105 15 105H35Z"
      fill="none"
      stroke="url(#accent)"
      stroke-width="4"
    />
  </g>

  <!-- Server icon -->
  <g transform="translate(900 155)" opacity="0.9">
    <rect x="0" y="0" width="125" height="32" rx="6" stroke="#38BDF8" stroke-width="2"/>
    <rect x="0" y="45" width="125" height="32" rx="6" stroke="#818CF8" stroke-width="2"/>
    <circle cx="18" cy="16" r="4" fill="#38BDF8"/>
    <circle cx="18" cy="61" r="4" fill="#818CF8"/>
    <line x1="35" y1="16" x2="105" y2="16" stroke="#64748B" stroke-width="3"/>
    <line x1="35" y1="61" x2="105" y2="61" stroke="#64748B" stroke-width="3"/>
  </g>

  <!-- Connection lines -->
  <g stroke="url(#accent)" stroke-width="2" opacity="0.7">
    <path d="M720 90L850 90"/>
    <path d="M760 130L850 130"/>
    <path d="M780 210L900 210"/>
  </g>

  <!-- Terminal -->
  <g transform="translate(720 190)">
    <rect width="135" height="70" rx="8" fill="#020617" stroke="#334155"/>
    <text x="15" y="27" fill="#38BDF8" font-family="monospace" font-size="15">$ deploy</text>
    <text x="15" y="50" fill="#94A3B8" font-family="monospace" font-size="12">status: running</text>
  </g>

  <!-- Main text -->
  <text
    x="80"
    y="105"
    fill="#F8FAFC"
    font-family="Arial, Helvetica, sans-serif"
    font-size="46"
    font-weight="700">
    ADITI KAPOOR
  </text>

  <text
    x="83"
    y="145"
    fill="#38BDF8"
    font-family="Arial, Helvetica, sans-serif"
    font-size="21"
    font-weight="600">
    CLOUD &amp; DEVOPS
  </text>

  <text
    x="83"
    y="180"
    fill="#94A3B8"
    font-family="Arial, Helvetica, sans-serif"
    font-size="16">
    AWS • Linux • Docker • Kubernetes • Terraform • CI/CD
  </text>

  <!-- Accent line -->
  <rect x="83" y="205" width="330" height="3" rx="2" fill="url(#accent)"/>

  <text
    x="83"
    y="240"
    fill="#64748B"
    font-family="monospace"
    font-size="14">
    BUILD • AUTOMATE • DEPLOY • SCALE
  </text>

</svg>